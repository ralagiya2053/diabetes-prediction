<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Diabetes Predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; background: #f2f2f2; display: none; }
    .positive { background: #ffe0e0 !important; }
    .negative { background: #e0f5e0 !important; }
  </style>
</head>
<body>
  <h1>Diabetes Risk Predictor</h1>

  <label>Gender
    <select id="gender">
      <option>Female</option>
      <option>Male</option>
      <option>Other</option>
    </select>
  </label>

  <label>Age <input id="age" type="number" value="54" /></label>
  <label>Hypertension (0/1) <input id="hypertension" type="number" min="0" max="1" value="0" /></label>
  <label>Heart disease (0/1) <input id="heart_disease" type="number" min="0" max="1" value="0" /></label>

  <label>Smoking history
    <select id="smoking_history">
      <option>never</option>
      <option>current</option>
      <option>former</option>
      <option>ever</option>
      <option>not current</option>
      <option>No Info</option>
    </select>
  </label>

  <label>BMI <input id="bmi" type="number" step="0.01" value="27.32" /></label>
  <label>HbA1c level <input id="HbA1c_level" type="number" step="0.1" value="6.6" /></label>
  <label>Blood glucose level <input id="blood_glucose_level" type="number" value="80" /></label>

  <button onclick="predict()">Predict</button>

  <div id="result"></div>

  <script>
    const API_URL = "https://xa22mu3snncho7eo5rxrua6qvm0ckdwu.lambda-url.us-east-1.on.aws/predict";

    async function predict() {
      const payload = {
        gender: document.getElementById("gender").value,
        age: parseFloat(document.getElementById("age").value),
        hypertension: parseInt(document.getElementById("hypertension").value),
        heart_disease: parseInt(document.getElementById("heart_disease").value),
        smoking_history: document.getElementById("smoking_history").value,
        bmi: parseFloat(document.getElementById("bmi").value),
        HbA1c_level: parseFloat(document.getElementById("HbA1c_level").value),
        blood_glucose_level: parseFloat(document.getElementById("blood_glucose_level").value),
      };

      const box = document.getElementById("result");
      box.style.display = "block";
      box.className = "";
      box.textContent = "Calling model...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        box.className = data.prediction === 1 ? "positive" : "negative";
        box.innerHTML = `<strong>Prediction:</strong> ${data.prediction === 1 ? "Diabetes risk detected" : "No diabetes risk"}<br/>
                         <strong>Probability:</strong> ${(data.probability * 100).toFixed(2)}%`;
      } catch (err) {
        box.className = "positive";
        box.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
